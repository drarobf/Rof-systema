<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Contrato & Consentimento — Clínica Dra. Rossana Fucks</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:14px;line-height:1.6;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:16px}

.header{background:linear-gradient(135deg,#0D0D0D 0%,#1a1205 100%);color:#E2C99A;padding:22px 20px;border-radius:14px;margin-bottom:16px;text-align:center;border:1px solid rgba(198,164,109,0.25)}
.header h1{font-size:22px;font-weight:900;letter-spacing:2px;font-family:Georgia,serif;margin-bottom:4px}
.header .sub{font-size:10px;color:#8B6914;letter-spacing:3px;text-transform:uppercase}
.header .clinic{font-size:12px;color:#C6A46D;margin-top:8px;opacity:0.9}

.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e8e4de;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.card-title{font-size:9px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:#8B6914;margin-bottom:12px;border-left:3px solid #C6A46D;padding-left:8px}
.field{margin-bottom:8px}
.field label{display:block;font-size:10px;color:#888;font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px}
.field value{display:block;color:#1a1a1a;font-size:13px;font-weight:600}

.proc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0ede8;gap:8px}
.proc-row:last-child{border-bottom:none}
.proc-name{flex:1;font-size:13px;color:#333}
.proc-val{font-size:13px;font-weight:700;color:#8B6914;white-space:nowrap}
.total-row{display:flex;justify-content:space-between;padding:10px 0 4px;margin-top:6px;border-top:2px solid #C6A46D}
.total-label{font-weight:700;font-size:13px}
.total-val{font-weight:900;font-size:16px;color:#8B6914}

/* Consent document */
.consent-box{background:#fff;border-radius:12px;padding:18px;margin-bottom:12px;border:1px solid #e8e4de;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.consent-box h2{font-size:14px;font-weight:900;text-align:center;margin-bottom:6px;color:#1a1a1a;font-family:Georgia,serif;line-height:1.4}
.consent-box .doc-sub{text-align:center;font-size:10px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #f0ede8}
.consent-box h3{font-size:10px;font-weight:700;color:#8B6914;text-transform:uppercase;letter-spacing:1.5px;margin:16px 0 6px;padding-bottom:3px;border-bottom:1px solid #f5f0e8}
.consent-box p{font-size:12px;color:#444;line-height:1.8;margin-bottom:6px}
.consent-box ul{padding-left:16px;margin-bottom:6px}
.consent-box li{font-size:12px;color:#444;line-height:1.8;margin-bottom:2px}
.consent-box .section-divider{border:none;border-top:2px solid #C6A46D;margin:20px 0 16px;opacity:0.4}
.consent-box .section-title{font-size:12px;font-weight:800;color:#8B6914;text-align:center;text-transform:uppercase;letter-spacing:2px;margin:20px 0 14px;padding:8px;background:rgba(198,164,109,0.06);border-radius:7px;border:1px solid rgba(198,164,109,0.15)}

/* Signature */
.sig-section{background:#fff;border-radius:12px;padding:18px;margin-bottom:12px;border:2px solid #C6A46D;box-shadow:0 2px 14px rgba(198,164,109,0.12)}
.sig-title{font-size:14px;font-weight:800;color:#1a1a1a;margin-bottom:16px;text-align:center}
.inp{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:9px;font-size:14px;font-family:inherit;outline:none;background:#fafaf8;color:#1a1a1a;transition:border-color 0.2s;margin-bottom:10px}
.inp:focus{border-color:#C6A46D;background:#fff}
canvas{border:2px dashed #C6A46D;border-radius:10px;background:#fafaf8;cursor:crosshair;display:block;width:100%;max-width:100%;touch-action:none}
.btn-row{display:flex;gap:8px;margin:8px 0}
.btn-clear{flex:1;padding:9px;background:#fff;border:1.5px solid #ddd;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;color:#888}
.btn-ok{flex:2;padding:9px;background:rgba(34,197,94,0.08);border:1.5px solid rgba(34,197,94,0.3);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:#166534;display:none}
.btn-submit{width:100%;padding:16px;background:linear-gradient(135deg,#8B6914,#C6A46D);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px;letter-spacing:0.5px;transition:opacity 0.2s}
.btn-submit:disabled{opacity:0.45;cursor:not-allowed}

.sig-tabs{display:flex;gap:6px;margin-bottom:12px}
.sig-tab{flex:1;padding:9px;background:#f5f5f0;border:1.5px solid #ddd;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;color:#888;transition:all 0.15s;font-family:inherit}
.sig-tab.active{background:rgba(198,164,109,0.1);border-color:rgba(198,164,109,0.5);color:#8B6914}

.check-row{display:flex;align-items:flex-start;gap:10px;padding:12px;background:#faf9f6;border-radius:8px;margin-bottom:10px;cursor:pointer;border:1px solid #ede9e0}
.check-row input[type=checkbox]{width:18px;height:18px;flex-shrink:0;margin-top:2px;accent-color:#C6A46D;cursor:pointer}
.check-row span{font-size:12px;color:#444;line-height:1.6}

.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.badge-pending{background:rgba(245,158,11,0.15);color:#b45309;border:1px solid rgba(245,158,11,0.35)}
.badge-ok{background:rgba(34,197,94,0.12);color:#166534;border:1px solid rgba(34,197,94,0.3)}

.alert{padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.6;margin-bottom:12px}
.alert-info{background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.2);color:#1e40af}

.loading{text-align:center;padding:60px 20px;color:#888}
.loading .spinner{width:36px;height:36px;border:3px solid #e8e4de;border-top-color:#C6A46D;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

.success-screen{text-align:center;padding:40px 20px}
.success-screen .icon{font-size:64px;margin-bottom:16px}
.success-screen h2{font-size:20px;font-weight:800;color:#166534;margin-bottom:8px;font-family:Georgia,serif}
.success-screen p{color:#555;font-size:13px;line-height:1.7;max-width:320px;margin:0 auto}

@media(max-width:480px){
  .wrap{padding:10px}
  .header{padding:18px 14px}
  .card,.consent-box,.sig-section{padding:13px}
}
</style>
</head>
<body>
<div class="wrap"><div id="app">
  <div class="loading"><div class="spinner"></div><div>Carregando contrato...</div></div>
</div></div>

<script>
const SUPABASE_URL      = 'https://dhgfoxdxihjkhzmctaea.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tn4i8425nfjfR5gKkWFb-A_wNwBd6Ec';
const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fmt(v){return Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2});}
function el(id){return document.getElementById(id);}
function getIdFromUrl(){return new URLSearchParams(location.search).get("id")||"";}

// ── Signature Pad ───────────────────────────────────────────────
let _padApi=null;
function initPad(canvasId,doneBtnId){
  const cv=el(canvasId);if(!cv)return null;
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.offsetWidth*dpr||600;
  cv.height=120*dpr;
  cv.style.height="120px";
  const ctx=cv.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.strokeStyle="#1a1a1a";ctx.lineWidth=2.2;ctx.lineJoin="round";ctx.lineCap="round";
  let drawing=false,hasDraw=false;
  const gxy=(e,c)=>{const r=c.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
    return[(s.clientX-r.left)*(c.width/r.width/dpr),(s.clientY-r.top)*(c.height/r.height/dpr)];};
  const start=e=>{e.preventDefault();drawing=true;const[x,y]=gxy(e,cv);ctx.beginPath();ctx.moveTo(x,y);};
  const move=e=>{e.preventDefault();if(!drawing)return;const[x,y]=gxy(e,cv);ctx.lineTo(x,y);ctx.stroke();hasDraw=true;const b=el(doneBtnId);if(b)b.style.display="flex";};
  const end=e=>{e.preventDefault();drawing=false;ctx.beginPath();};
  cv.addEventListener("mousedown",start);cv.addEventListener("mousemove",move);cv.addEventListener("mouseup",end);
  cv.addEventListener("touchstart",start,{passive:false});cv.addEventListener("touchmove",move,{passive:false});cv.addEventListener("touchend",end,{passive:false});
  window["clearPad_"+canvasId]=()=>{ctx.clearRect(0,0,cv.width/dpr,cv.height/dpr);hasDraw=false;const b=el(doneBtnId);if(b)b.style.display="none";};
  return{getImg:()=>hasDraw?cv.toDataURL("image/png"):null};
}

window.switchSigTab=function(tab){
  el("tab-draw").classList.toggle("active",tab==="draw");
  el("tab-type").classList.toggle("active",tab==="type");
  el("sig-draw-area").style.display=tab==="draw"?"block":"none";
  el("sig-type-area").style.display=tab==="type"?"block":"none";
};

function enableSubmitCheck(){
  const btn=el("btn-submit");if(!btn)return;
  const nome=(el("sig-nome")?.value||"").trim();
  const agree=el("sig-agree")?.checked;
  btn.disabled=!(nome.length>2&&agree);
}

window.submitAssinatura=async function(intakeId,ptName){
  const nome=(el("sig-nome")?.value||"").trim();
  const cpf=(el("sig-cpf")?.value||"").trim();
  const agree=el("sig-agree")?.checked;
  if(!nome){alert("Por favor, insira seu nome completo.");el("sig-nome").focus();return;}
  if(!agree){alert("Você precisa confirmar que leu e concordou com todo o contrato.");return;}

  const isType=el("sig-type-area")&&el("sig-type-area").style.display!=="none";
  const sigCanvas=(!isType&&_padApi)?_padApi.getImg():null;
  const sigTyped=isType?(el("sig-typed")?.value||"").trim()||nome:null;

  const btn=el("btn-submit");
  if(btn){btn.disabled=true;btn.textContent="Enviando...";}
  try{
    const {data:row}=await _sb.from("rof_intake").select("data").eq("id",intakeId).single();
    const merged=Object.assign({},row?.data||{},{
      sigCanvas,sigTyped,sigNome:nome,sigCpf:cpf,
      assinadoEm:new Date().toISOString(),
      sigUserAgent:navigator.userAgent
    });
    const {error}=await _sb.from("rof_intake").update({
      status:"submitted",submitted_at:new Date().toISOString(),data:merged
    }).eq("id",intakeId);
    if(error)throw error;
    el("app").innerHTML=`<div class="header"><h1>ROF™</h1><div class="sub">Clínica Odontológica</div><div class="clinic">Dra. Rossana Batista Fucks — CRO/SC 21403</div></div>
    <div class="success-screen">
      <div class="icon">✅</div>
      <h2>Contrato Assinado!</h2>
      <p>Obrigado, <b>${ptName}</b>!<br/><br/>Sua assinatura digital foi registrada com segurança. A Dra. Rossana receberá a confirmação automaticamente.<br/><br/>Qualquer dúvida, entre em contato com a clínica. 🦷</p>
      <div style="margin-top:22px;padding:14px;background:rgba(34,197,94,0.07);border-radius:10px;border:1px solid rgba(34,197,94,0.2)">
        <div style="font-size:11px;color:#166534">🔒 Registro: ${new Date().toLocaleString("pt-BR")} — dados de acesso armazenados com segurança.</div>
      </div>
    </div>`;
  }catch(e){
    console.error(e);
    if(btn){btn.disabled=false;btn.textContent="✅ Assinar e Enviar Contrato";}
    alert("Erro ao enviar. Verifique sua conexão e tente novamente.\n\n"+((e&&e.message)||""));
  }
};

// ── Bloco de assinatura já realizada (modo leitura) ────────────
function sigDoneBox(d){
  const assinadoEm=d.assinadoEm?new Date(d.assinadoEm).toLocaleString("pt-BR"):"—";
  return`<div style="background:#fff;border:2px solid #22c55e;border-radius:12px;padding:18px;margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#166534;margin-bottom:14px">✅ Documento Assinado Digitalmente</div>
    ${d.sigCanvas?`<img src="${d.sigCanvas}" style="max-height:64px;max-width:240px;display:block;margin-bottom:10px;border:1px solid #e5e5e5;border-radius:8px"/>`:""}
    <div style="font-size:14px;font-weight:700;color:#1a1a1a">${d.sigNome||d.ptName||"—"}</div>
    ${d.sigCpf?`<div style="font-size:12px;color:#888;margin-top:2px">CPF: ${d.sigCpf}</div>`:""}
    <div style="font-size:11px;color:#888;margin-top:6px">📅 Assinado em: <b>${assinadoEm}</b></div>
    <div style="margin-top:10px;font-size:10px;color:#aaa;line-height:1.5;padding:8px;background:#f9fef9;border-radius:6px;border:1px solid rgba(34,197,94,0.15)">🔒 Assinatura digital válida conforme Lei 14.063/2020 · Sistema ROF™</div>
  </div>`;
}

// ── Build Termo de Consentimento HTML ──────────────────────────
function buildTermo(d, readOnly){
  const procs=(d.termProcs||[]).map((pr,i)=>`
    <div style="margin-bottom:10px;padding:10px 12px;background:#f9f5e8;border-radius:8px;border-left:3px solid #C6A46D">
      <div style="font-weight:700;font-size:12px;color:#8B6914;margin-bottom:3px">${i+1}. ${pr.n}</div>
      <div style="font-size:11.5px;color:#555;line-height:1.7">${pr.d}</div>
    </div>`).join("");

  const sigSection=readOnly?sigDoneBox(d):`
  <div class="sig-section">
    <div class="sig-title">✍️ Assinatura Digital do Paciente</div>
    <div class="alert alert-info">📖 Role para cima para ler o termo completo. Ao assinar você declara ter lido, compreendido e concordado com tudo acima.</div>
    <input id="sig-nome" class="inp" placeholder="Nome completo (igual ao documento)" autocomplete="name"/>
    <input id="sig-cpf" class="inp" placeholder="CPF (ex: 123.456.789-00)" inputmode="numeric"/>
    <div class="sig-tabs">
      <button class="sig-tab active" id="tab-draw" onclick="switchSigTab('draw')">✍️ Assinar com o dedo</button>
      <button class="sig-tab" id="tab-type" onclick="switchSigTab('type')">⌨️ Digitar nome</button>
    </div>
    <div id="sig-draw-area">
      <div style="font-size:11px;color:#888;text-align:center;margin-bottom:7px">Use o dedo para assinar abaixo</div>
      <canvas id="sig-canvas"></canvas>
      <div class="btn-row">
        <button class="btn-clear" onclick="clearPad_sig-canvas()">🗑 Limpar</button>
        <button class="btn-ok" id="sig-ok-btn">✅ Assinatura registrada</button>
      </div>
    </div>
    <div id="sig-type-area" style="display:none">
      <input id="sig-typed" class="inp" placeholder="Digite seu nome completo..." style="font-family:cursive;font-size:18px;color:#8B6914"/>
    </div>
    <label class="check-row">
      <input type="checkbox" id="sig-agree"/>
      <span><b>Confirmo que li e concordo</b> com todas as informações do Termo de Consentimento acima, incluindo os riscos, contraindicações e cuidados pós-procedimento.</span>
    </label>
    <button id="btn-submit" class="btn-submit" disabled>✅ Assinar e Enviar Termo</button>
    <div style="text-align:center;margin-top:10px;font-size:10px;color:#bbb">🔒 Assinatura registrada com segurança. Validade jurídica conforme Lei 14.063/2020.</div>
  </div>`;

  return`
  <div class="card">
    <div class="card-title">Paciente</div>
    <div style="font-size:14px;font-weight:700;color:#1a1a1a">${d.ptName||"—"}</div>
    ${d.ptCpf?`<div style="font-size:12px;color:#888;margin-top:2px">CPF: ${d.ptCpf}</div>`:""}
  </div>

  <div class="consent-box">
    <div style="display:inline-flex;align-items:center;gap:10px;background:rgba(198,164,109,0.07);border:1px solid rgba(198,164,109,0.18);border-radius:10px;padding:10px 16px;margin-bottom:16px;width:100%">
      <span style="font-size:26px">${d.termEmoji||"📋"}</span>
      <div>
        <div style="font-weight:900;font-size:14px;color:#1a1a1a">${d.termName||"Termo de Consentimento"}</div>
        <div style="font-size:11px;color:#888;margin-top:1px">${d.termSub||""}</div>
      </div>
    </div>
    <h2 style="font-size:12px;font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:2px;color:#888;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #f0ede8">TERMO DE CONSENTIMENTO LIVRE E ESCLARECIDO<br/>Clínica Dra. Rossana Batista Fucks — CRO/SC 21403</h2>

    ${procs?`<h3>Procedimentos do Protocolo</h3>${procs}`:""}

    <h3>⚠️ Riscos e Efeitos Adversos</h3>
    <p style="white-space:pre-line">${d.termRiscos||""}</p>

    <h3>🚫 Contraindicações</h3>
    <p>${d.termContras||""}</p>

    <h3>✅ Cuidados Pós-Procedimento</h3>
    <p style="white-space:pre-line">${d.termPos||""}</p>

    <h3>Declaração do Paciente</h3>
    <p style="background:#faf5e8;padding:10px 12px;border-radius:7px;border:1px solid rgba(198,164,109,0.2);font-style:italic">${d.termDecl||""}</p>

// ── Build full unified contract HTML ───────────────────────────
function buildContract(d, readOnly){
  const etapas=d.etapas||[];
  const procsHtml=etapas.length>0
    ?etapas.map(e=>`<div class="proc-row"><span class="proc-name">${e.proc||"Procedimento"}</span><span class="proc-val">R$ ${fmt(e.valor)}</span></div>`).join("")
      +(d.desconto>0
        ?`<div class="proc-row"><span class="proc-name" style="font-size:11px;color:#aaa">Subtotal</span><span class="proc-val" style="font-size:11px;color:#aaa">R$ ${fmt(d.subtotal)}</span></div>
           <div class="proc-row"><span class="proc-name" style="font-size:11px;color:#b91c1c">Desconto</span><span class="proc-val" style="font-size:11px;color:#b91c1c">− R$ ${fmt(d.desconto)}</span></div>`
        :"")
    :`<div style="color:#aaa;font-size:12px;padding:8px 0">A definir</div>`;

  const pgtoDesc=d.forma==="Parcelado"&&d.total>0
    ?`${d.parcelas}x de R$ ${fmt(d.total/d.parcelas)} (total R$ ${fmt(d.total)})`
    :`${d.forma||"À vista"} — R$ ${fmt(d.total)}`;

  const hoje=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});

  return`
  <div class="card">
    <div class="card-title">Dados do Paciente (Contratante)</div>
    <div class="field"><label>Nome completo</label><value>${d.ptName||"—"}</value></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <div class="field"><label>CPF</label><value>${d.ptCpf||"—"}</value></div>
      <div class="field"><label>RG</label><value>${d.ptRg||"—"}</value></div>
    </div>
    <div class="field"><label>Telefone</label><value>${d.ptPhone||"—"}</value></div>
    ${d.ptEnd?`<div class="field"><label>Endereço</label><value>${d.ptEnd}</value></div>`:""}
  </div>

  <div class="card">
    <div class="card-title">Procedimentos Contratados</div>
    ${procsHtml}
    <div class="total-row">
      <span class="total-label">TOTAL</span>
      <span class="total-val">R$ ${fmt(d.total)}</span>
    </div>
    <div style="margin-top:10px;padding:9px 11px;background:#faf9f6;border-radius:8px;border:1px solid #ede9e0">
      <div style="font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px">Pagamento</div>
      <div style="font-size:13px;font-weight:700;color:#333">${pgtoDesc}</div>
      ${d.obs?`<div style="font-size:11px;color:#888;margin-top:3px">${d.obs}</div>`:""}
    </div>
    ${d.prazo?`<div style="margin-top:7px;font-size:11px;color:#888">⏱ Prazo estimado: ${d.prazo} meses</div>`:""}
  </div>

  <div class="consent-box">
    <h2>CONTRATO DE PRESTAÇÃO DE SERVIÇOS ODONTOLÓGICOS<br/>E TERMOS DE CONSENTIMENTO INFORMADO</h2>
    <div class="doc-sub">Clínica Dra. Rossana Batista Fucks — CRO/SC 21403</div>

    <div class="section-title">🦷 Termo de Consentimento — Cirurgia de Implante Osseointegrado</div>

    <h3>O Procedimento</h3>
    <p>O implante dentário osseointegrado é um dispositivo de titânio inserido cirurgicamente no osso alveolar, servindo de raiz artificial para suporte de coroa, prótese parcial ou total. A osseointegração (fusão implante/osso) leva de 3 a 6 meses.</p>

    <h3>Riscos e Possíveis Intercorrências</h3>
    <ul>
      <li><b>Falha na osseointegração</b> (5–10% dos casos): pode exigir remoção e novo implante após cicatrização.</li>
      <li>Dor, edema e hematoma pós-operatórios (esperados e transitórios).</li>
      <li>Infecção local (peri-implantite) se higiene inadequada.</li>
      <li>Sensibilidade ou alteração temporária de sensibilidade na região.</li>
      <li>Reabsorção óssea marginal ao redor do implante ao longo do tempo.</li>
      <li>Possível necessidade de enxerto ósseo prévio se volume ósseo insuficiente.</li>
      <li>Em casos raros: comunicação com seio maxilar (implantes superiores posteriores).</li>
    </ul>

    <h3>Fatores que Aumentam o Risco de Falha</h3>
    <ul>
      <li>Tabagismo — reduz significativamente a taxa de sucesso.</li>
      <li>Diabetes não controlada e osteoporose.</li>
      <li>Uso de bifosfonatos ou medicamentos que afetam o metabolismo ósseo.</li>
      <li>Higiene bucal inadequada e ausência às consultas de acompanhamento.</li>
    </ul>

    <h3>Cuidados Pós-operatórios Obrigatórios</h3>
    <ul>
      <li>Repouso nas primeiras 24h; evitar esforço físico por 72h.</li>
      <li>Compressas frias nas primeiras 24h (gelo protegido com pano).</li>
      <li>Dieta líquida/pastosa fria nos primeiros dias.</li>
      <li>Não fumar por no mínimo 30 dias.</li>
      <li>Tomar os medicamentos prescritos rigorosamente e no horário.</li>
      <li>Higiene suave na região cirúrgica conforme orientação recebida.</li>
    </ul>

    <h3>Responsabilidade em Caso de Falha</h3>
    <p>A falha na osseointegração, quando comprovada, poderá ser corrigida com novo implante mediante novo orçamento. A Contratada emprega todos os recursos disponíveis, mas não pode garantir resultados absolutos em razão da resposta biológica individual.</p>

    <!-- ══ PRÓTESE ════════════════════════════════════════════════ -->

    <div class="section-title">💎 Termo de Consentimento — Prótese Dentária</div>

    <h3>O Procedimento</h3>
    <p>Próteses dentárias (coroas, facetas, pontes, próteses sobre implante, próteses removíveis) visam restaurar função mastigatória, estética e fonação. O resultado estético é personalizado e pode exigir ajustes até a adaptação ideal.</p>

    <h3>Limitações e Expectativas</h3>
    <ul>
      <li>A seleção de cor é realizada com guias padronizados; pode haver variação entre a cor aprovada e o resultado final em boca conforme iluminação e tecidos adjacentes.</li>
      <li>Ajustes de oclusão (mordida) são comuns e esperados nas consultas iniciais.</li>
      <li>Facetas de porcelana podem apresentar trincas ou lascamento em traumas ou bruxismo.</li>
      <li>Próteses removíveis requerem período de adaptação de semanas a meses.</li>
      <li>Reabsorção óssea progressiva pode alterar o assentamento de próteses totais ao longo dos anos.</li>
    </ul>

    <h3>Riscos</h3>
    <ul>
      <li>Sensibilidade dentinária temporária após preparo dos dentes (esperado e transitório).</li>
      <li>Necessidade de tratamento endodôntico (canal) caso o dente não suporte o preparo — situação incomum mas possível.</li>
      <li>Descimentação da prótese — recimentação sem custo adicional no período de garantia.</li>
      <li>Fratura da peça por trauma ou bruxismo — avaliação individual de cobertura.</li>
    </ul>

    <h3>Cuidados e Manutenção</h3>
    <ul>
      <li>Higiene cuidadosa com escova macia e fio dental.</li>
      <li>Uso de placa de bruxismo se indicado.</li>
      <li>Evitar morder objetos duros (unhas, canetas, gelo, embalagens).</li>
      <li>Retornos de manutenção semestrais obrigatórios.</li>
    </ul>

    <h3>Garantia</h3>
    <p>A prótese tem garantia de reajuste e recimentação (se aplicável) por 12 meses a partir da entrega, desde que os cuidados acima sejam seguidos e o paciente compareça às consultas de manutenção.</p>
